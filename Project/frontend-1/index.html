    <!-- Dark mode (v3.0): apply the visitor's saved choice before first paint; dark.css downloads only when needed. -->
    <script>
      (function () {
        try {
          if (JSON.parse(localStorage.getItem("mfr_mode")) === "dark") {
            var r = document.documentElement;
            r.setAttribute("data-mode", "dark");
            r.style.colorScheme = "dark";
            if (!document.getElementById("mfr-dark-css")) {
              var l = document.createElement("link");
              l.id = "mfr-dark-css"; l.rel = "stylesheet"; l.href = "/css/dark.css";
              document.head.appendChild(l);
            }
          }
        } catch (e) {}
      })();
    </script>
