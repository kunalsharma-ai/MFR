
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Enable Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;

    # Compress text-based and web application assets
    gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/x-javascript
    application/json
    application/xml
    application/xml+rss
    application/manifest+json
    application/wasm
    image/svg+xml
    font/ttf
    font/otf
    application/vnd.ms-fontobject;

    # ---------- Browser caching ----------
    # Vite puts content-hashed bundles in /assets/: the file name changes whenever the file does, so cache for a year.
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Fonts never change under the same name: a year. PageSpeed (Lighthouse 13 "Use efficient cache lifetimes") and
    # SEOptimer flag anything under ~97 days, so a month was reported as "short cache lifetime".
    location ~* \.(?:woff2?|ttf|otf|eot)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Images, video, audio, 3D models: not hashed, so 180 days, and browsers may keep showing the old copy for a day
    # while they fetch a replaced file. Give a replaced image a new file name if it must show up at once.
    location ~* \.(?:png|jpe?g|gif|webp|avif|svg|ico|mp4|webm|mp3|glb|gltf|wasm)$ {
        add_header Cache-Control "public, max-age=15552000, stale-while-revalidate=86400";
        try_files $uri =404;
    }

    # CSS/JS outside /assets/ (public/css, public/js) and the web manifest: a week.
    location ~* \.(?:css|js|webmanifest)$ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # sitemap.xml, robots.txt, llms.txt: a day, so crawlers see fresh copies after a deploy.
    location ~* \.(?:xml|txt)$ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
        expires off;
    }

    # Not requested by the site any more (the service-worker registration is inlined), kept for old cached pages.
    location = /registerSW.js {
        add_header Cache-Control "no-cache";
        expires off;
    }

    # Relative Location headers: behind the gateway an absolute one would point at http:// and the internal port.
    absolute_redirect off;

    # One URL per page. Canonicals and the sitemap use /about-us (no trailing slash), so /about-us/ redirects there
    # instead of serving a duplicate.
    location ~ ^(?<noslash>.+)/$ {
        return 301 $noslash$is_args$args;
    }

    # Older page URLs (see MASTER_PROMPT.md site map) now live at shorter paths.
    location = /rewards-and-payouts { return 301 /rewards$is_args$args; }
    location = /quality-and-data-security { return 301 /trust-and-safety$is_args$args; }

    location / {
        # Prerendered HTML pages: always revalidate so visitors get new content right after a deploy
        # (nginx still answers 304 Not Modified when nothing changed).
        add_header Cache-Control "no-cache";

        # Every route is prerendered to <route>/index.html. Serve it directly: the old rule redirected /about-us to
        # /about-us/ (a 301 on every inner page, while the canonical says /about-us). Unknown paths get a real 404
        # page instead of a soft-404 copy of the home page.
        try_files $uri.html $uri/index.html $uri =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        add_header Cache-Control "no-cache";
        internal;
    }
}
