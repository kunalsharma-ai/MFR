
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Enable Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;

    # Compress text-based and web application assets
    gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/x-javascript
    application/json
    application/xml
    application/xml+rss
    application/manifest+json
    application/wasm
    image/svg+xml
    font/ttf
    font/otf
    application/vnd.ms-fontobject;

    location = /sw.js {
        add_header Cache-Control "no-cache";
        expires off;
    }

    location / {
        set $req_path $uri;

        if ($uri ~ ^(.+)/$) {
            set $req_path $1;
        }

        try_files $req_path.html $uri $uri/ $uri.html /index.html;
    }
}
