log_format proxy '[$time_local] $upstream_cache_status $upstream_status $status - $request_method $scheme $host "$request_uri" [Client $remote_addr] [Length $body_bytes_sent] [Gzip $gzip_ratio] [Sent-to server] "$http_user_agent" "$http_referer"';
log_format standard '[$time_local] $status - $request_method $scheme $host "$request_uri" [Client $remote_addr] [Length $body_bytes_sent] [Gzip $gzip_ratio] "$http_user_agent" "$http_referer"';


map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
map $scheme $hsts_header {
    https "max-age=63072000; preload";
}

server {
    listen 80;
    listen [::]:80;
    set $forward_scheme http;

    server_name *.sampledge.duckdns.org *.myfrequentrewards.com myfrequentrewards.com;
    proxy_http_version 1.1;

    access_log /data/logs/proxy-host-mfr_access.log proxy;
    error_log /data/logs/proxy-host-mfr_error.log warn;
    location / {
        proxy_pass http://web-dev:3000;
        include /etc/nginx/http.d/proxy-headers;
    }
    # Custom
    include /data/nginx/custom/server_proxy[.]conf;
}