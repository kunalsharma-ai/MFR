server {
    listen 80;
    listen [::]:80;

    server_name 
        mfr.sampledge.duckdns.org
        myfrequentrewards.com
        www.myfrequentrewards.com
        new.myfrequentrewards.com
        mfr-prod.sampledge.duckdns.org;

    set $forward_scheme http;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    access_log /data/logs/${host}_access.log proxy;
    error_log /data/logs/${host}_error.log warn;

    include /etc/nginx/http.d/21-headers.conf;

    # One hop to the canonical host. Canonicals, the sitemap and the JSON-LD all use https://www.myfrequentrewards.com,
    # so the bare domain goes straight there (SEO auditors flagged "multiple page redirects" and the bare domain
    # collects backlinks of its own). TLS and http->https happen in the proxy in front of this gateway.
    if ($host = myfrequentrewards.com) {
        return 301 https://www.myfrequentrewards.com$request_uri;
    }

    location / {
        proxy_pass http://$upstream;
    }
}
