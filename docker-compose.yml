networks:
  publicweb:
    external: true
  mfr:
    external: false
services:
  web-prod:
    image: registry.sampledge.com/my-frequent-rewards/web:1.0.0
    build:
      context: Project/web
      target: production
    restart: no
    networks:
      - mfr
  web-dev:
    image: mfr-web:dev-1.0.0
    build:
      context: Project/web
      target: development
    restart: unless-stopped
    volumes:
      - ./Project/web:/frfs
      - /frfs/node_modules
    networks:
      - mfr
  gateway:
    image: registry.sampledge.com/microservice/api-gateway:1.0.0
    container_name: ${PROJECT}-gateway
    restart: always
    networks:
      - publicweb
      - mfr
    volumes:
      - ./Project/services/gateway/config:/etc/nginx/http.d
      - ./Project/services/gateway/logs:/data/logs
    dns:
      - 8.8.8.8