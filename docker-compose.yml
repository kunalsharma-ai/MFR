networks:
  publicweb:
    external: true
  mfr:
    external: false
  db:
    external: false
services:
  mqtt:
    image: nats
    container_name: ${PROJECT}-service-mqtt
    command: ['-js',"-m","8222"]
    networks:
      - mfr
    volumes:
      - ./mqtt:/data/jetstream
    # ports:
    #   - 8222:8222
  api-email-template:
    image: registry.sampledge.com/microservice/email-template
    container_name: ${PROJECT}-api-email-template
    restart: unless-stopped
    volumes:
      - ./Project/mailer:/app/mailer
    networks:
      - mfr

  db:
    image: mongo
    container_name: ${PROJECT}-mongodb
    restart: always
    volumes:
      - ./db/store:/data/db
      - ./db/dump:/backup
    networks:
      - db
  api-get-country:
    image: registry.sampledge.com/microservice/get-country
    container_name: ${PROJECT}-api-get-country
    restart: unless-stopped
    volumes:
      - /etc/services:/etc/services :ro
    networks:
      - mfr
  api-validator-email:
    image: registry.sampledge.com/validator/email
    container_name: ${PROJECT}-api-email-validator
    restart: always
    networks:
      - mfr
  backend:
    image: optiwariindia/express:api-module-1.0.1
    restart: unless-stopped
    networks:
      - mfr
      - db
    env_file:
      - ./environment/my-frequent-rewards.env
    volumes:
      - ./Project/api/app:/src/app
      - ./Project/public:/src/public
      - ./Project/api/package.json:/src/package.json
  
  migrate-db:
    image: optiwariindia/express:api-module-1.0.1
    volumes:
      - ./migrate:/src
    networks:
      - db
  email:
    image: registry.sampledge.com/microservice/email:smtp-1.0.0
    build:
      context: services/email
      target: development
    container_name: ${PROJECT}-email
    env_file:
      - environment/${PROJECT}.env
    volumes:
      - ./Project/services/email/server.js:/app/server.js
      - ./Project/services/email/utils:/app/utils
      - ./Project/services/email/config:/app/config
    networks:
      - mfr
    restart: always
  storage:
    image: registry.sampledge.com/microservice/storage:1.0.0
    container_name: ${PROJECT}-service-storage
    volumes:
      - ./Project/services/storage/uploads:/data
      - ./Project/services/storage/hosts:/app/hosts
    environment:
      - public=/data
    networks:
      - mfr
    restart: unless-stopped
  web-prod:
    image: registry.sampledge.com/my-frequent-rewards/web:2.0.0
    build:
      context: Project/web
      target: production
    restart: no
    networks:
      - mfr
  web-dev:
    image: mfr-web:dev-1.0.0
    build:
      context: Project/web
      target: development
    restart: unless-stopped
    volumes:
      - ./Project/web:/frfs
      - /frfs/node_modules
    networks:
      - mfr
  gateway:
    image: registry.sampledge.com/microservice/api-gateway:1.0.0
    container_name: ${PROJECT}-gateway
    restart: always
    networks:
      - publicweb
      - mfr
    volumes:
      - ./Project/services/gateway/config:/etc/nginx/http.d
      - ./Project/services/gateway/logs:/data/logs
    dns:
      - 8.8.8.8